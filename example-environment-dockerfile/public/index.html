<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>devenv Forward Port Test</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Iosevka Etoile", "Fira Sans", sans-serif;
        background: #f4efe5;
        color: #1f2a2e;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(239, 148, 95, 0.32), transparent 28%),
          radial-gradient(circle at bottom right, rgba(64, 135, 150, 0.25), transparent 30%),
          linear-gradient(135deg, #f8f4ed, #ebe1d1);
      }

      main {
        width: min(680px, calc(100vw - 32px));
        padding: 32px;
        border-radius: 24px;
        background: rgba(255, 252, 247, 0.86);
        box-shadow: 0 24px 60px rgba(56, 45, 31, 0.16);
        border: 1px solid rgba(116, 96, 73, 0.14);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3.2rem);
        line-height: 1;
      }

      p {
        margin: 0 0 16px;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      code {
        padding: 0.15rem 0.45rem;
        border-radius: 999px;
        background: rgba(31, 42, 46, 0.08);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        background: #1f2a2e;
        color: #f7efe3;
        font-weight: 600;
      }

      .status::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #89d38c;
        box-shadow: 0 0 0 6px rgba(137, 211, 140, 0.18);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">forwardPorts is working</div>
      <h1>devenv example page</h1>
      <p>This page is being served from the Dockerfile example container.</p>
      <p>If you can see this at <code>http://127.0.0.1:8000</code>, the forwarded port path is working end to end.</p>
    </main>
  </body>
</html>
